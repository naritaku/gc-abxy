# Deploys site/ (the user manual and the /fw, /support redirects) to Cloudflare Pages project "gc-abxy".
# main -> https://gc-abxy.pages.dev/ ; other branches and pull requests -> <branch>.gc-abxy.pages.dev (preview).
name: site

on:
  push:
    branches: ["**"]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # The manual's revision history is a single "<build date> 1st Release" line until the first real revision;
      # stamp today's date (JST) into it on every deploy.
      - name: Stamp the build date into the revision history
        run: |
          d=$(TZ=Asia/Tokyo date +%Y/%m/%d)
          sed -i -E "s#<span data-build-date>[0-9/]+</span>#<span data-build-date>$d</span>#" site/index.html
          grep -q "<span data-build-date>$d</span>" site/index.html || { echo "::error::build date placeholder not found in site/index.html"; exit 1; }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=gc-abxy --branch=${{ github.head_ref || github.ref_name }}
