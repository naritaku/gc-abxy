# Deploys site/ (the user manual and the /fw, /support redirects) and functions/ (Markdown for agents) to Cloudflare
# Pages project "gc-abxy".
# main -> https://gc-abxy.pages.dev/ ; other branches and pull requests -> <branch>.gc-abxy.pages.dev (preview).
name: site

on:
  push:
    branches: ["**"]
    paths: ["site/**", "functions/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # Every page's footer carries the revision history ("<build date> 1st Release") and the spec date;
      # stamp today's date (JST) into all pages on every deploy.
      - name: Stamp the build date into the revision history
        run: |
          d=$(TZ=Asia/Tokyo date +%Y/%m/%d)
          find site -name '*.html' -print0 | xargs -0 sed -i -E "s#<span data-build-date>[0-9/]+</span>#<span data-build-date>$d</span>#"
          grep -q "<span data-build-date>$d</span>" site/index.html || { echo "::error::build date placeholder not found in site/index.html"; exit 1; }
      # Until the first firmware release exists, /fw would 404 (releases/latest has no asset). Point it at a
      # "coming soon" page instead. The firmware workflow re-runs this deploy after it publishes a release.
      - name: Point /fw at the coming-soon page while there is no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "${{ github.repository }}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'gc-abxy.uf2'; then
            echo "latest release has gc-abxy.uf2; /fw goes to the download"
          else
            sed -i -E 's#^/fw[[:space:]]+[^[:space:]]+[[:space:]]+302$#/fw        /fw-pending.html  302#' site/_redirects
            grep -q '^/fw *\/fw-pending.html' site/_redirects || { echo "::error::could not rewrite /fw in site/_redirects"; exit 1; }
            # the footer's "latest firmware" (/releases) would land on an empty release list; send it to the same page
            sed -i -E 's#^/releases[[:space:]]+[^[:space:]]+[[:space:]]+302$#/releases  /fw-pending.html  302#' site/_redirects
            grep -q '^/releases *\/fw-pending.html' site/_redirects || { echo "::error::could not rewrite /releases in site/_redirects"; exit 1; }
            echo "no release yet; /fw and /releases go to fw-pending.html"
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=gc-abxy --branch=${{ github.head_ref || github.ref_name }}
