# gc-abxy REV A firmware config (ZMK v0.3.0).
CONFIG_ZMK_KEYBOARD_NAME="GC-ABXY"

# USB + BLE HID; USB preferred when connected (ZMK default). No BIOS boot protocol (keeps USB_DEVICE_SOF off).
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
# CONFIG_ZMK_USB_BOOT is not set

# Exactly 3 BLE host profiles (SR-BLE-02)
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3

# ZMK Studio over USB (SR-CFG-01). Locking off for bring-up; enable with a &studio_unlock binding later.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Battery: CR2450 through 1M/1M divider on AIN2, gauged by the module driver gc,battery-cr2450 (CR2450 table).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# gc-abxy module (firmware/module/gc_abxy): management state machine, status LED, device name GC-ABXY-XXXX
CONFIG_GC_ABXY_MGMT=y
CONFIG_GC_ABXY_LED=y
CONFIG_GC_ABXY_DEVICE_NAME=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_GPIO=y

# Firmware version readable from the host via the BLE Device Information Service (SR-MAINT-04).
# CI overrides the string with the tag (vX.Y.Z) or dev-<sha7>; a local build without the override reports "dev".
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="dev"

# No deep sleep as a product requirement (physical main switch); idle only.
CONFIG_ZMK_SLEEP=n
