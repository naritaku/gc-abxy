<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>GC ABXY ソフトウェア（準備中）</title>
<style>
  :root{--ground:#f7f7fa;--surface:#fff;--ink:#1a1a24;--ink-2:#4a4a5c;--line:#e2e2ec;--accent:#574c9b}
  @media (prefers-color-scheme:dark){:root{--ground:#131318;--surface:#1c1c24;--ink:#e9e9f2;--ink-2:#b6b6c8;--line:#2d2d3a;--accent:#a49af0}}
  body{margin:0;background:var(--ground);color:var(--ink);font:15.5px/1.9 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:56px 16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 10px;color:var(--ink-2)}
  a{color:var(--accent)}
</style>
<main>
  <div class="card">
    <h1>ソフトウェアは準備中です</h1>
    <p>GC ABXY に書き込むソフトウェア（gc-abxy.uf2）は、まだ公開していません。公開したら、取扱説明書の手順のリンクからそのままダウンロードできるようになります。</p>
    <p><a href="/">取扱説明書に戻る</a> ・ <a href="/support">問い合わせ</a></p>
  </div>
</main>
</html>
